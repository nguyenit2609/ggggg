<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PTOOL ❄🌸</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #ffe4e1; /* Hồng nhạt */
            overflow-x: hidden;
            position: relative;
        }

        .container {
            max-width: 600px;
            margin: 30px auto;
            padding: 20px;
            background: white;
            border-radius: 15px;
            box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.1);
            position: relative;
            z-index: 10;
        }

        .menu {
            display: flex;
            justify-content: space-around;
            background: #ff69b4;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .menu button {
            background: none;
            border: none;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .menu button:hover {
            transform: scale(1.1);
            text-decoration: underline;
        }

        .section {
            display: none;
            animation: fadeIn 0.5s;
        }

        .active {
            display: block;
        }

        .title {
            text-align: center;
            font-size: 26px;
            font-weight: bold;
            color: #ff69b4;
            margin-bottom: 20px;
            text-shadow: 2px 2px 8px rgba(255, 20, 147, 0.2);
        }

        .download-btn {
            display: block;
            width: 100%;
            max-width: 350px;
            background: #ff69b4;
            color: white;
            text-align: center;
            padding: 12px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
            margin: 10px auto;
            transition: 0.3s;
        }

        .download-btn:hover {
            background: #ff1493;
            transform: scale(1.05);
        }

        /* Hiệu ứng tuyết rơi */
        .snowflake {
            position: fixed;
            top: -10px;
            color: white;
            font-size: 15px;
            opacity: 0.8;
            user-select: none;
            z-index: 1;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% { transform: translateY(0); opacity: 0; }
            20% { opacity: 1; }
            100% { transform: translateY(100vh); opacity: 0; }
        }

        /* Hiệu ứng hoa nở khi click */
        .flower {
            position: absolute;
            width: 30px;
            height: 30px;
            background-image: url('https://i.imgur.com/vxrJFCg.png');
            background-size: cover;
            pointer-events: none;
            animation: bloom 0.6s linear;
        }

        @keyframes bloom {
            0% { transform: scale(0); opacity: 1; }
            100% { transform: scale(1.5); opacity: 0; }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>
    <p>Địt con mẹ thăng phước </p>
</body>
</html>
